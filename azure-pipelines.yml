trigger:
  branches:
    include:
    - master
    - main
    - Sprint_1

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'Azure-Connection' 
  testWebAppName: 'mydevopsapp-test-123'
  prodWebAppName: 'mydevopsapp-prod-123'

stages:
# ==========================================
# المرحلة الأولى: البناء والاختبار (CI)
# ==========================================
- stage: Build
  displayName: 'Build, Test, and Publish'
  jobs:
  - job: BuildJob
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build the project'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish the project'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ==========================================
# المرحلة الثانية: النشر لبيئة الاختبار (CD - Test)
# ==========================================
- stage: DeployToTest
  displayName: 'Deploy to Test Environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTest
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'
          
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Test App'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              WebAppName: '$(testWebAppName)'
              packageForLinux: '$(System.ArtifactsDirectory)/drop/**/*.zip'
              appSettings: '-ASPNETCORE_ENVIRONMENT Production -ConnectionStrings__DefaultConnection "Data Source=/home/data/app.db" -WEBSITE_RUN_FROM_PACKAGE 1'

# ==========================================
# المرحلة الثالثة: النشر لبيئة الإنتاج (CD - Production)
# ==========================================
- stage: DeployToProduction
  displayName: 'Deploy to Production Environment'
  dependsOn: DeployToTest
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: 'Production' # الكلمة دي هي السر اللي هنعمل بيها الموافقة اليدوية
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'
          
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Prod App'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              WebAppName: '$(prodWebAppName)'
              packageForLinux: '$(System.ArtifactsDirectory)/drop/**/*.zip'
              appSettings: '-ASPNETCORE_ENVIRONMENT Production -ConnectionStrings__DefaultConnection "Data Source=/home/data/app.db" -WEBSITE_RUN_FROM_PACKAGE 1'